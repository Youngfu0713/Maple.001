<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>治愈系手帳管理</title>
    
    <style>
        /* 韓系治愈配色方案 */
        :root {
            --paper-bg: #fffaf6;        /* 暖奶油紙色 */
            --soft-pink: #f8d7da;       /* 柔粉色 */
            --soft-blue: #d1e7dd;       /* 莫蘭迪綠 */
            --soft-lavender: #e2d1f9;   /* 柔紫色 */
            --text-color: #6b5e58;      /* 溫柔咖啡色 */
            --border-color: #e5dcd6;    /* 淺紙框線 */
            --shadow: 0 4px 6px rgba(180, 160, 150, 0.15);
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: #f7f3ef; /* 背景稍微深一點，突出手帳紙感 */
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        /* 手帳本體：像是一張貼在桌面上的紙 */
        .calendar-container {
            width: 100%; max-width: 500px; 
            background: var(--paper-bg); 
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
            border-radius: 30px;
            margin: 10px;
            border: 2px solid #fff;
        }

        /* 標題與導航 */
        h1 { font-weight: 300; letter-spacing: 2px; text-align: center; color: #a18e86; }
        
        .nav-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.8rem;
            color: #8b7d76;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover { background: var(--soft-pink); border-color: var(--soft-pink); }

        /* 輸入框設計：像便條紙 */
        .event-form input[type="text"] {
            border: 1px dashed var(--border-color);
            border-radius: 15px;
            background: #fff;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 提交按鈕：水彩渲染效果 */
        .submit-btn {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            border: none;
            border-radius: 50px;
            color: #795548;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(248, 187, 208, 0.3);
        }

        /* 事件卡片：像貼紙一樣的設計 */
        .event-card {
            background: #ffffff;
            border-radius: 20px;
            border-left: 5px solid var(--soft-pink);
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .event-text-line { font-family: 'Handwriting', cursive, sans-serif; font-size: 1rem; }

        /* 類別標籤：小圓點 */
        .cat-tag-btn {
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
            background: #fff;
            opacity: 0.8;
        }
        .cat-tag-btn.active {
            background: var(--soft-blue);
            color: #fff;
            border-color: var(--soft-blue);
        }

        /* Utility 區域 */
        .utility-control-bar { margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 15px; }

        /* 彈窗設計：像信封一樣打開 */
        .action-sheet {
            background: #fff;
            border-radius: 30px 30px 0 0;
            padding: 30px;
        }

        /* 修正滾動與版面 */
        .timeline { margin-top: 20px; }
        
    </style>
</head>
<body>
    <!-- 這邊保持原本的 HTML 結構不變，以便你的程式碼邏輯無痛銜接 -->
    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav" style="display:flex; gap:5px; margin-bottom: 15px;">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
        </div>

        <div class="event-form" style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="evt-title" placeholder="寫下今天的小心願..." required>
            <button class="submit-btn" id="add-evt-btn">＋ 加入手帳</button>
        </div>

        <div class="timeline" id="timeline-list">
            <!-- 這裡會由 JS 動態生成 -->
        </div>
    </div>

    <!-- 引用你原本的 JavaScript -->
    <script>
        // 你原本的 JS 邏輯可以完全複製貼在這裡
        // ... (保持你原有的 JS 程式碼) ...
    </script>
</body>
</html>
