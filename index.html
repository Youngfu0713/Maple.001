<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 完整功能版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'MiaoFont';
            src: url('Miao.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --primary: #5151e5;
            --primary-hover: #3d3dbd;
            --primary-light: #eef2ff;
            --bg-main: #fcfbfa; 
            --bg-card: #ffffff;
            --text-main: #1e293b; 
            --text-muted: #64748b;
            --border: #f1f5f9;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }

        /* --- 風格主題定義 --- */
        body[data-theme="macaron"] {
            --primary: #f07b95;
            --primary-hover: #d85c78;
            --primary-light: #fff0f3;
            --bg-main: #faf6f0;
            --bg-card: #ffffff;
            --text-main: #4a3e3d;
            --text-muted: #8c7a78;
            --border: #f3e5df;
            --border-hover: #e6c2b8;
        }

        body[data-theme="dark"] {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --primary-light: #1e1b4b;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --border-hover: #475569;
        }

        body[data-theme="nordic"] {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --primary-light: #ccfbf1;
            --bg-main: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #132a2f;
            --text-muted: #52796f;
            --border: #e0e7e5;
            --border-hover: #b2c9c2;
        }

        body {
            font-family: "MiaoFont", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0;
            display: flex; justify-content: center; overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s, color 0.25s;
        }

        .calendar-container {
            width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh;
            box-shadow: var(--shadow-md); display: flex; flex-direction: column; position: relative;
        }

        .calendar-header { padding: 16px 20px 10px 20px; background: var(--bg-card); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .calendar-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
        .quick-nav { display: flex; gap: 6px; margin-bottom: 8px; }
        .nav-btn { font-family: inherit; padding: 8px 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; flex: 1; text-align: center; -webkit-tap-highlight-color: transparent; }
        #btn-today { flex: 1.1; background: var(--primary); color: white; border: none; font-weight: 800; }
        #btn-month { flex: 1.2; background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); font-weight: 800; }

        .date-picker-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 2px 0; margin-bottom: 8px; }
        .date-picker-label-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 0.78rem; color: var(--text-muted); }
        .date-picker-row input[type="date"] { font-family: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-muted); background: var(--bg-main); }

        .font-color-picker-container { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.9rem; font-weight: 700; color: var(--text-muted); background: var(--bg-main); }
        .font-color-picker-container input[type="color"] { border: none; width: 22px; height: 22px; background: none; padding: 0; cursor: pointer; }

        .quick-jump-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; width: 100%; min-width: 0; }
        .quick-jump-title { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); display: flex; align-items: center; gap: 2px; white-space: nowrap; flex-shrink: 0; }
        .quick-jump-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; flex-grow: 1; }
        .quick-jump-btn { font-family: inherit; font-size: 0.73rem; font-weight: 700; padding: 3px 8px; border-radius: 14px; border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-main); white-space: nowrap; cursor: pointer; flex-shrink: 0; }

        .event-form { padding: 14px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; gap: 8px; }
        .event-form input[type="text"] { font-family: inherit; flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--bg-main); outline: none; }

        .submit-btn { font-family: inherit; background: var(--primary); color: white; border: none; padding: 11px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; cursor: pointer; }

        .timeline { padding: 10px 20px 20px 20px; flex-grow: 1; background: var(--bg-main); min-height: 300px; }
        .event-card { border: 1px solid transparent; border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); cursor: pointer; background: var(--bg-card); }
        .event-text-line { font-size: 0.92rem; font-weight: 700; margin: 0; }

        /* --- Modal 樣式 --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .action-sheet { font-family: inherit; width: 100%; max-width: 550px; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 24px 20px 34px 20px; transform: translateY(100%); transition: transform 0.32s ease-out; display: flex; flex-direction: column; gap: 16px; }
        .modal-overlay.show .action-sheet { transform: translateY(0); }
        .sheet-header { border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        .sheet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .sheet-btn { font-family: inherit; background-color: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-weight: 800; font-size: 0.88rem; }
        .sheet-btn.danger-btn { grid-column: span 2; }
        
        .sheet-edit-panel, .sheet-move-date-panel, .sheet-category-panel, .sheet-tag-action-panel { display: none; background: var(--bg-main); border-radius: var(--radius-lg); padding: 16px; flex-direction: column; gap: 10px; }
        .sheet-edit-panel.show, .sheet-move-date-panel.show, .sheet-category-panel.show, .sheet-tag-action-panel.show { display: flex; }
        .sheet-panel-submit { font-family: inherit; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); padding: 11px; cursor: pointer; }
        .sheet-close-btn { font-family: inherit; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-muted); padding: 10px; border-radius: var(--radius-md); cursor: pointer; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
            <div class="date-picker-row">
                <input type="date" id="date-select">
                <div class="font-color-picker-container">
                    <input type="color" id="evt-font-color" value="#000000">
                </div>
            </div>
        </div>

        <div class="event-form">
            <input type="text" id="evt-title" placeholder="請輸入重要事項...">
            <button class="submit-btn" id="add-evt-btn">安排至行程表</button>
        </div>

        <div class="timeline" id="timeline-list"></div>
    </div>

    <!-- 操作 Modal -->
    <div class="modal-overlay" id="action-modal" onclick="closeActionModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <p class="sheet-event-title" id="modal-event-title" style="font-weight: 800; margin:0;">載入中...</p>
            </div>
            <!-- 主選單 Grid -->
            <div class="sheet-grid" id="standard-action-grid">
                <button class="sheet-btn" id="modal-btn-edit">編輯內文</button>
                <button class="sheet-btn" id="modal-btn-move">跨日期移動</button>
                <button class="sheet-btn" id="modal-btn-copy">複製本事件</button>
                <button class="sheet-btn" id="modal-btn-category">切換類別</button>
                <button class="sheet-btn danger-btn" id="modal-btn-delete" style="color:#ef4444;">刪除本行程</button>
            </div>
            
            <!-- 編輯面板 -->
            <div class="sheet-edit-panel" id="modal-edit-panel">
                <input type="text" id="modal-edit-title-input" style="padding:10px; border-radius:6px; border:1px solid #ccc;">
                <input type="color" id="modal-edit-color-input">
                <button class="sheet-panel-submit" id="modal-edit-submit">確認修改</button>
            </div>

            <!-- 移動面板 -->
            <div class="sheet-move-date-panel" id="modal-move-panel">
                <input type="date" id="modal-move-date-input" style="padding:10px; border-radius:6px; border:1px solid #ccc;">
                <button class="sheet-panel-submit" id="modal-move-submit">確認移轉</button>
            </div>

            <button class="sheet-close-btn" onclick="closeActionModal()">關閉選單</button>
        </div>
    </div>

    <script>
        let currentDate = new Date().toISOString().split('T')[0];
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let activeTargetEventId = null;

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderTimeline();
            setupEventListeners();
            setupModalButtons(); // 初始化 Modal 按鈕監聽
        });

        // 綁定基本事件
        function setupEventListeners() {
            document.getElementById('add-evt-btn').addEventListener('click', () => {
                const title = document.getElementById('evt-title').value;
                if(!title) return;
                events.push({ id: 'evt-' + Date.now(), date: currentDate, title, fontColor: document.getElementById('evt-font-color').value });
                saveAndRender();
                document.getElementById('evt-title').value = '';
            });
        }

        // --- 核心邏輯 ---
        function renderTimeline() {
            const container = document.getElementById('timeline-list');
            container.innerHTML = '';
            const dayEvents = events.filter(e => e.date === currentDate);
            
            dayEvents.forEach(evt => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `<p class="event-text-line" style="color:${evt.fontColor}">${evt.title}</p>`;
                card.onclick = () => openActionModal('event', evt.id);
                container.appendChild(card);
            });
        }

        function openActionModal(type, eventId) {
            activeTargetEventId = eventId;
            const evt = events.find(e => e.id === eventId);
            document.getElementById('modal-event-title').innerText = evt ? evt.title : "載入中...";
            document.getElementById('standard-action-grid').style.display = 'grid';
            document.getElementById('modal-edit-panel').classList.remove('show');
            document.getElementById('modal-move-panel').classList.remove('show');
            document.getElementById('action-modal').classList.add('show');
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('show');
        }

        function closeAllSheetPanels() {
            document.getElementById('modal-edit-panel').classList.remove('show');
            document.getElementById('modal-move-panel').classList.remove('show');
            document.getElementById('standard-action-grid').style.display = 'none';
        }

        // --- 設定 Modal 按鈕功能 ---
        function setupModalButtons() {
            // 點擊編輯按鈕
            document.getElementById('modal-btn-edit').addEventListener('click', () => {
                closeAllSheetPanels();
                document.getElementById('modal-edit-panel').classList.add('show');
                const evt = events.find(e => e.id === activeTargetEventId);
                document.getElementById('modal-edit-title-input').value = evt.title;
                document.getElementById('modal-edit-color-input').value = evt.fontColor || '#000000';
            });

            // 點擊刪除按鈕
            document.getElementById('modal-btn-delete').addEventListener('click', () => {
                if(confirm('確定要刪除此行程嗎？')) {
                    events = events.filter(e => e.id !== activeTargetEventId);
                    saveAndRender();
                    closeActionModal();
                }
            });

            // 確認修改
            document.getElementById('modal-edit-submit').addEventListener('click', () => {
                const evtIdx = events.findIndex(e => e.id === activeTargetEventId);
                if (evtIdx > -1) {
                    events[evtIdx].title = document.getElementById('modal-edit-title-input').value;
                    events[evtIdx].fontColor = document.getElementById('modal-edit-color-input').value;
                    saveAndRender();
                    closeActionModal();
                }
            });
        }

        function saveAndRender() {
            localStorage.setItem('calendar_events', JSON.stringify(events));
            renderTimeline();
        }
    </script>
</body>
</html>
