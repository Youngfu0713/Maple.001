<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 優化版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'MiaoFont';
            src: url('Miao.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --primary: #5151e5; --primary-hover: #3d3dbd; --primary-light: #eef2ff;
            --bg-main: #fcfbfa; --bg-card: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b;
            --border: #f1f5f9; --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }

        /* --- 6種主題定義 --- */
        body[data-theme="default"] { --primary: #5151e5; --bg-main: #fcfbfa; }
        body[data-theme="macaron"] { --primary: #f07b95; --primary-light: #fff0f3; --bg-main: #faf6f0; --text-main: #4a3e3d; --text-muted: #8c7a78; --border: #f3e5df; }
        body[data-theme="dark"] { --primary: #818cf8; --primary-light: #1e1b4b; --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
        body[data-theme="nordic"] { --primary: #0d9488; --primary-light: #ccfbf1; --bg-main: #f4f7f6; --text-main: #132a2f; --text-muted: #52796f; --border: #e0e7e5; }
        body[data-theme="sunshine"] { --primary: #f59e0b; --primary-light: #fef3c7; --bg-main: #fffbeb; --text-main: #92400e; --text-muted: #b45309; --border: #fde68a; }
        body[data-theme="violet"] { --primary: #8b5cf6; --primary-light: #ede9fe; --bg-main: #faf5ff; --text-main: #5b21b6; --text-muted: #7c3aed; --border: #ddd6fe; }

        body { font-family: "MiaoFont", sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }
        
        .calendar-container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; margin: auto; box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
        
        /* ... (保留原本的 CSS，並新增主題彈窗樣式) ... */
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .theme-btn { padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); font-weight: 800; cursor: pointer; text-align: center; }
        .theme-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }

        .calendar-header { padding: 16px 20px 10px 20px; background: var(--bg-card); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .calendar-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
        
        /* 統一按鈕與佈局 */
        .quick-nav { display: flex; gap: 6px; margin-bottom: 10px; }
        .nav-btn { font-family: inherit; padding: 8px 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; flex: 1; }
        
        /* Modal 通用 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.4); z-index: 999; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .action-sheet { width: 100%; max-width: 550px; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s; }
        .modal-overlay.show .action-sheet { transform: translateY(0); }
        .sheet-close-btn { width: 100%; padding: 12px; background: var(--bg-main); border: none; border-radius: 10px; margin-top: 10px; font-weight: 800; }
        
        /* 補充原樣式... */
        .date-picker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .quick-jump-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .event-form { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .timeline { padding: 10px 20px; flex-grow: 1; }
        .event-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .font-color-picker-container { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        .font-color-picker-container input[type="color"] { border: none; width: 22px; height: 22px; background: none; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-month">📅 月</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
            
            <!-- 新的風格切換按鈕 -->
            <button class="nav-btn" id="btn-open-theme" style="width: 100%; margin-bottom: 8px; border: 1px dashed var(--primary); color: var(--primary);">🎨 切換風格主題 (目前: <span id="theme-name">經典藍</span>)</button>

            <div class="date-picker-row">
                <input type="date" id="date-select">
                <div class="font-color-picker-container">
                    <label for="evt-font-color">🪄</label>
                    <input type="color" id="evt-font-color" value="#000000">
                </div>
            </div>

            <div class="quick-jump-bar" id="quick-jump-bar">
                <span class="quick-jump-title">📍 跳轉：</span>
                <button class="quick-jump-btn" id="btn-jump-to-input">📍</button>
                <div class="quick-jump-list" id="quick-jump-list" style="display:flex; gap:5px; overflow-x:auto;"></div>
            </div>
        </div>

        <div class="event-form">
            <input type="text" id="evt-title" placeholder="請輸入重要事項..." style="padding:10px; border:1px solid var(--border); border-radius:6px;">
            <button class="submit-btn" id="add-evt-btn" style="background:var(--primary); color:white; border:none; padding:10px; border-radius:6px; cursor:pointer;">安排至行程表</button>
        </div>

        <div class="timeline" id="timeline-list"></div>
    </div>

    <!-- 主題風格 Modal -->
    <div class="modal-overlay" id="theme-modal" onclick="closeThemeModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div style="text-align: center; font-weight: 800; margin-bottom: 10px;">選擇風格主題</div>
            <div class="theme-grid">
                <button class="theme-btn" data-theme="default">經典藍</button>
                <button class="theme-btn" data-theme="macaron">馬卡龍</button>
                <button class="theme-btn" data-theme="dark">深色夜間</button>
                <button class="theme-btn" data-theme="nordic">清新薄荷</button>
                <button class="theme-btn" data-theme="sunshine">暖陽黃</button>
                <button class="theme-btn" data-theme="violet">紫羅蘭</button>
            </div>
            <button class="sheet-close-btn" onclick="closeThemeModal()">關閉</button>
        </div>
    </div>

    <script>
        // 核心邏輯保留
        let currentTheme = localStorage.getItem('calendar_theme') || 'default';
        
        // 主題設置函式
        function setTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('calendar_theme', theme);
            document.getElementById('theme-name').innerText = document.querySelector(`[data-theme="${theme}"]`).innerText;
            
            // 更新 UI 按鈕狀態
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
            });
        }

        function openThemeModal() { document.getElementById('theme-modal').classList.add('show'); }
        function closeThemeModal() { document.getElementById('theme-modal').classList.remove('show'); }

        window.addEventListener('DOMContentLoaded', () => {
            setTheme(currentTheme);
            document.getElementById('btn-open-theme').addEventListener('click', openThemeModal);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.getAttribute('data-theme'));
                    closeThemeModal();
                });
            });
            // ... 其餘您的原始邏輯 (init, renderTimeline 等) ...
        });
    </script>
</body>
</html>
