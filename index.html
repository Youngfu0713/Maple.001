<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 標籤管理優化版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'MiaoFont';
            src: url('Miao.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --primary: #5151e5;
            --primary-hover: #3d3dbd;
            --primary-light: #eef2ff;
            --bg-main: #fcfbfa; 
            --bg-card: #ffffff;
            --text-main: #1e293b; 
            --text-muted: #64748b;
            --border: #f1f5f9;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }

        /* --- 風格主題定義 --- */
        body[data-theme="macaron"] {
            --primary: #f07b95;
            --primary-hover: #d85c78;
            --primary-light: #fff0f3;
            --bg-main: #faf6f0;
            --bg-card: #ffffff;
            --text-main: #4a3e3d;
            --text-muted: #8c7a78;
            --border: #f3e5df;
            --border-hover: #e6c2b8;
        }

        body[data-theme="dark"] {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --primary-light: #1e1b4b;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --border-hover: #475569;
        }

        body[data-theme="nordic"] {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --primary-light: #ccfbf1;
            --bg-main: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #132a2f;
            --text-muted: #52796f;
            --border: #e0e7e5;
            --border-hover: #b2c9c2;
        }

        body {
            font-family: "MiaoFont", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0;
            display: flex; justify-content: center; overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s, color 0.25s;
        }

        .calendar-container {
            width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh;
            box-shadow: var(--shadow-md); display: flex; flex-direction: column; position: relative;
        }

        .calendar-header { padding: 16px 20px 10px 20px; background: var(--bg-card); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .calendar-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
        
        /* 導覽列調整 */
        .quick-nav { display: flex; gap: 6px; margin-bottom: 8px; }
        .nav-btn { font-family: inherit; padding: 8px 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; flex: 1; text-align: center; -webkit-tap-highlight-color: transparent; }
        #btn-today { flex: 1.1; background: var(--primary); color: white; border: none; font-weight: 800; }
        
        /* --- 跳轉日期列 --- */
        .date-picker-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 2px 0; margin-bottom: 8px; }
        .date-picker-label-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 0.78rem; color: var(--text-muted); }
        .date-picker-row input[type="date"] { font-family: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-muted); background: var(--bg-main); }

        .font-color-picker-container { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.9rem; font-weight: 700; color: var(--text-muted); background: var(--bg-main); }
        .font-color-picker-container input[type="color"] { border: none; width: 22px; height: 22px; background: none; padding: 0; cursor: pointer; }

        /* --- 行程快速跳轉 (Layout 修改) --- */
        .quick-jump-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; width: 100%; min-width: 0; }
        .quick-jump-list { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .quick-jump-btn { font-family: inherit; font-size: 0.73rem; font-weight: 700; padding: 3px 8px; border-radius: 14px; border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-main); white-space: nowrap; cursor: pointer; transition: all 0.2s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
        .quick-jump-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .jump-to-input-btn { background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); font-weight: 800; font-size: 0.9rem !important; }

        /* Emoji 面板 & Form 樣式維持不變 */
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 10px 0; max-height: 50vh; overflow-y: auto; }
        .emoji-item-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: var(--bg-card); border: 1px solid var(--border-hover); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .event-form { padding: 14px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; gap: 8px; }
        .event-form input[type="text"] { font-family: inherit; flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--bg-main); color: var(--text-main); outline: none; }
        
        .color-control-row { display: flex; align-items: center; justify-content: flex-end; width: 100%; }
        .inline-overview-btn { font-family: inherit; padding: 8px 14px; background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 800; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        
        .category-selector-container { display: flex; flex-direction: column; gap: 8px; }
        .cat-row-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .cat-label-title { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); min-width: 45px; }
        .cat-tag-btn { font-family: inherit; padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 2px solid transparent; cursor: pointer; opacity: 0.45; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .cat-tag-btn.active { opacity: 1; border-color: rgba(30, 41, 59, 0.7); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1); }
        .color-edit-toggle { font-family: inherit; padding: 5px 10px; border-radius: 20px; background: var(--bg-main); border: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }

        .sub-cat-container-box { display: none; background: var(--bg-main); padding: 12px; border-radius: var(--radius-md); border: 1px dashed var(--border-hover); }
        .sub-cat-container-box.active { display: block; }
        .sub-cat-group-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; border-bottom: 1px dashed var(--border-hover); padding-bottom: 8px; }
        .sub-cat-group-title { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .sub-cat-pills-list { display: flex; gap: 5px; flex-wrap: wrap; }
        .sub-cat-tag-btn { font-family: inherit; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
        .sub-cat-tag-btn.active { background: var(--text-main); color: var(--bg-card); border-color: var(--text-main); font-weight: 800; }

        .utility-control-bar { padding: 12px 20px 10px 20px; background: var(--bg-main); display: flex; flex-direction: column; gap: 8px; }
        .utility-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .sort-label { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); }
        .sort-select-wrapper { display: flex; gap: 4px; }
        .sort-btn { font-family: inherit; font-size: 0.72rem; font-weight: 800; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-muted); cursor: pointer; }
        .sort-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
        .export-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .pdf-export-btn { font-family: inherit; padding: 8px 12px; background: var(--bg-card); color: #ef4444; border: 1px solid #fca5a5; border-radius: var(--radius-md); font-size: 0.78rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow-sm); }
        .img-export-btn { font-family: inherit; padding: 8px 12px; background: var(--bg-card); color: #10b981; border: 1px solid #a7f3d0; border-radius: var(--radius-md); font-size: 0.78rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow-sm); }

        .timeline { padding: 10px 20px 20px 20px; flex-grow: 1; position: relative; background: var(--bg-main); min-height: 300px; }
        .event-card { border: 1px solid transparent; border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); cursor: pointer; background: var(--bg-card); transition: transform 0.2s, box-shadow 0.2s; }
        .event-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .event-text-line { font-size: 0.92rem; font-weight: 700; margin: 0; line-height: 1.5; word-break: break-all; }
        .prefix-badge-main { font-weight: 900; margin-right: 2px; }
        .prefix-badge-time { font-weight: 900; color: var(--text-muted); background: var(--bg-main); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-hover); margin-right: 4px; font-size: 0.85rem; }
        .sub-pills-text-row { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; word-break: break-all; }

        .manual-move-actions { display: flex; gap: 2px; }
        .move-step-btn { border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-muted); width: 24px; height: 24px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }

        /* Modals & Sheets (維持原樣) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.45); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .action-sheet { font-family: inherit; width: 100%; max-width: 550px; background: var(--bg-card); color: var(--text-main); border-radius: 20px 20px 0 0; padding: 24px 20px 34px 20px; box-shadow: 0 -15px 40px rgba(15, 23, 42, 0.12); transform: translateY(100%); transition: transform 0.32s ease-out; display: flex; flex-direction: column; gap: 16px; max-height: 85vh; overflow-y: auto; }
        .modal-overlay.show .action-sheet { transform: translateY(0); }
        .sheet-close-btn { font-family: inherit; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.82rem; font-weight: 700; cursor: pointer; padding: 10px; border-radius: var(--radius-md); text-align: center; }

        @keyframes pulse-highlight { 0% { transform: scale(1); box-shadow: 0 0 0 rgba(81, 81, 229, 0); } 50% { transform: scale(1.02); box-shadow: 0 0 14px rgba(81, 81, 229, 0.45); border: 2px solid var(--primary); } 100% { transform: scale(1); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); } }
        .card-highlight { animation: pulse-highlight 1.2s ease-in-out; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            
            <!-- 導覽列：Month 已移至右側 -->
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
                <button class="nav-btn" id="btn-month" style="margin-left: auto; background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); font-weight: 800;">📅 月</button>
            </div>
            
            <div class="utility-row" style="margin-bottom: 8px;">
                <span class="sort-label">🎨 風格：</span>
                <div class="sort-select-wrapper" id="theme-btn-group">
                    <button class="sort-btn" data-theme="default">經典藍</button>
                    <button class="sort-btn" data-theme="macaron">馬卡龍</button>
                    <button class="sort-btn" data-theme="dark">深色夜間</button>
                    <button class="sort-btn" data-theme="nordic">清新薄荷</button>
                </div>
            </div>

            <div class="date-picker-row">
                <div class="date-picker-label-group">
                    <label for="date-select">跳轉日期：</label>
                    <input type="date" id="date-select">
                </div>
                <div class="font-color-picker-container">
                    <label for="evt-font-color">🪄</label>
                    <input type="color" id="evt-font-color" value="#000000">
                </div>
                <button class="quick-jump-btn" id="btn-toggle-emoji-modal" style="margin-left: auto; background: var(--bg-card); border-color: var(--primary); color: var(--primary); padding: 5px 12px; border-radius: var(--radius-sm); font-size: 1.1rem; cursor: pointer;">😃</button>
            </div>

            <!-- 行程快速跳轉：📍 與 ⚡ 已移至左側 -->
            <div class="quick-jump-bar" id="quick-jump-bar">
                <div style="display: flex; gap: 5px; flex-shrink: 0;">
                    <button class="quick-jump-btn jump-to-input-btn" id="btn-jump-to-input">📍</button>
                    <button class="quick-jump-btn" id="btn-jump-to-sort" style="background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); padding: 3px 10px;">⚡️</button>
                </div>
                <div class="quick-jump-list" id="quick-jump-list"></div>
            </div>
        </div>

        <div class="event-form">
            <div class="form-row">
                <input type="text" id="evt-title" placeholder="請輸入重要事項..." required>
                <button class="quick-time-btn" id="btn-quick-time">⚡ 快速記時</button>
            </div>
            <button class="submit-btn" id="add-evt-btn">安排至行程表</button>
            <div class="color-control-row">
                <button class="inline-overview-btn" id="btn-cat-overview">🏷️ 類別總覽</button>
            </div>
            <div class="category-selector-container">
                <div class="cat-row-wrapper">
                    <span class="cat-label-title">主類別：</span>
                    <div id="category-buttons-list" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-grow: 1;"></div>
                    <button class="color-edit-toggle" id="color-toggle-btn">⚙️ 管理</button>
                </div>
                <div class="sub-cat-container-box" id="sub-category-container"></div>
            </div>
        </div>

        <div class="utility-control-bar" id="sort-order-section">
            <div class="export-btn-group">
                <button class="pdf-export-btn" id="btn-export-pdf">📄 輸出 PDF</button>
                <button class="img-export-btn" id="btn-export-img">📸 輸出圖檔</button>
            </div>
            <div class="utility-row">
                <span class="sort-label">排列順序：</span>
                <div class="sort-select-wrapper">
                    <button class="sort-btn" id="sort-btn-manual">✍️ 手動</button>
                    <button class="sort-btn" id="sort-btn-az">🔤 A-Z</button>
                    <button class="sort-btn" id="sort-btn-za">🔤 Z-A</button>
                </div>
            </div>
        </div>

        <div class="timeline" id="timeline-list"></div>
    </div>

    <script>
        // (此處保留原有邏輯，僅替換上述 Header HTML)
        function getLocalTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        let currentDate = getLocalTodayString();
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let sortMode = localStorage.getItem('calendar_sort_mode') || 'manual';
        let currentTheme = localStorage.getItem('calendar_theme') || 'default';
        
        let categories = JSON.parse(localStorage.getItem('calendar_categories')) || [
            { id: "cat_work", name: "工作公務", color: "#5151e5", subGroups: [{ id: "g1", title: "專案A組", items: ["開發", "測試", "上線"] }] },
            { id: "cat_life", name: "日常生活", color: "#10b981", subGroups: [{ id: "g3", title: "家庭事務", items: ["吃飯", "購物清單"] }] }
        ];

        const customEmojiList = ['✅', '✔️', '☑️', '🔘', '⚪', '➕', '➖', '⭕', '❌', '🙆‍♀️', '🙅‍♀️', '🙆‍♂️', '🙅‍♂️', '★', '☆'];

        let selectedMainCatId = categories[0]?.id || "";
        let managementActiveCatId = categories[0]?.id || ""; 
        let selectedSubItems = []; 

        window.addEventListener('DOMContentLoaded', () => {
            setTheme(currentTheme);
            initDateConfig();
            renderCategorySelectors();
            renderTimeline();
            setupEventListeners();
            updateSortBtnUI();
        });

        function setupEventListeners() {
            document.getElementById('btn-prev').addEventListener('click', () => changeDate(-1));
            document.getElementById('btn-next').addEventListener('click', () => changeDate(1));
            document.getElementById('btn-today').addEventListener('click', () => { currentDate = getLocalTodayString(); initDateConfig(); renderTimeline(); });
            document.getElementById('btn-month').addEventListener('click', () => alert('開啟月曆功能')); // 需對應原月曆 Modal
            document.getElementById('btn-jump-to-input').addEventListener('click', jumpToInputTitle);
            document.getElementById('btn-jump-to-sort').addEventListener('click', () => { document.getElementById('sort-order-section').scrollIntoView({ behavior: 'smooth' }); });
            document.getElementById('add-evt-btn').addEventListener('click', submitEventForm);
            // ... (其他事件監聽維持不變)
        }

        function setTheme(theme) {
            currentTheme = theme; document.body.setAttribute('data-theme', theme); localStorage.setItem('calendar_theme', theme);
        }

        function changeDate(offset) {
            const parts = currentDate.split('-').map(Number);
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            d.setDate(d.getDate() + offset);
            currentDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            initDateConfig(); renderTimeline();
        }

        function initDateConfig() { document.getElementById('date-select').value = currentDate; }
        
        function renderTimeline() {
            // (原有渲染邏輯)
        }

        function jumpToInputTitle() { document.getElementById('evt-title').focus(); }

        function updateSortBtnUI() { /* 原有排序邏輯 */ }
        function renderCategorySelectors() { /* 原有類別渲染邏輯 */ }
        function submitEventForm() { /* 原有提交邏輯 */ }
    </script>
</body>
</html>
