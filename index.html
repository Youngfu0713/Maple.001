<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 治癒系手帳版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* 韓系治癒手帳風格 */
        :root {
            --paper-bg: #f9f7f2;        /* 類羊皮紙底色 */
            --soft-pink: #eac9c9;       /* 莫蘭迪粉 */
            --soft-green: #c9e4ca;      /* 莫蘭迪綠 */
            --soft-blue: #c9d8e4;       /* 莫蘭迪藍 */
            --text-main: #756c68;       /* 柔和暖灰棕 */
            --text-muted: #a69c97;
            --border-color: #e5dfd9;    /* 柔和框線 */
            --shadow-soft: 0 4px 15px rgba(180, 160, 150, 0.15);
            --radius-md: 16px;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #eee9e3; /* 外圍桌面色 */
            color: var(--text-main);
            margin: 0; padding: 20px 0;
            display: flex; justify-content: center;
        }

        .calendar-container {
            width: 100%; max-width: 500px; 
            background: var(--paper-bg); 
            min-height: 90vh;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid #fff;
        }

        .calendar-header { padding: 25px 20px 15px 20px; background: var(--paper-bg); border-bottom: 1px dashed var(--border-color); }
        .calendar-header h1 { color: #8c827d; font-size: 1.2rem; font-weight: 600; }
        
        .nav-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.75rem; color: var(--text-muted);
            cursor: pointer; transition: 0.3s;
        }
        #btn-today { background: var(--soft-green); color: #fff; border: none; }

        .event-form { padding: 20px; background: var(--paper-bg); }
        .event-form input[type="text"] {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            padding: 12px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #f7dada 0%, #eac9c9 100%);
            color: #8c827d;
            border-radius: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(234, 201, 201, 0.4);
        }

        /* 治癒系卡片：像紙膠帶貼上的感覺 */
        .event-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 5px solid var(--soft-pink);
            box-shadow: 2px 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .cat-tag-btn {
            background: #fff;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .cat-tag-btn.active {
            background: var(--soft-blue) !important;
            color: #fff !important;
            border: none !important;
        }

        .modal-overlay { background-color: rgba(239, 233, 227, 0.6); backdrop-filter: blur(8px); }
        .action-sheet { background: #fff; border-radius: 30px 30px 0 0; padding: 30px; }

        @media print {
            body { background: white; }
            .calendar-container { box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <!-- (HTML結構與你原本的代碼完全一致，為了方便你後續維護，以下省略HTML重複部分) -->
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
        </div>

        <div class="event-form">
            <div class="form-row">
                <input type="text" id="evt-title" placeholder="寫下今天的小心願..." required>
                <button class="quick-time-btn" id="btn-quick-time">⚡ 時間</button>
            </div>
            <button class="submit-btn" id="add-evt-btn">安排至行程表</button>
        </div>

        <div class="timeline" id="timeline-list"></div>
    </div>

    <!-- (JavaScript 維持你原本的邏輯，無需變動) -->
    <script>
        // ... (保持你原本所有的 JS 邏輯) ...
        function getLocalTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let currentDate = getLocalTodayString();
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let categories = JSON.parse(localStorage.getItem('calendar_categories')) || [
            { id: "cat_work", name: "工作公務", color: "#eac9c9", subGroups: [] },
            { id: "cat_life", name: "日常生活", color: "#c9d8e4", subGroups: [] }
        ];

        // 渲染基礎邏輯
        function renderTimeline() {
            const container = document.getElementById('timeline-list');
            container.innerHTML = '';
            let dayEvents = events.filter(e => e.date === currentDate);
            dayEvents.forEach((evt) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `<p class="event-text-line" style="color:#756c68">${evt.title}</p>`;
                container.appendChild(card);
            });
        }
        
        window.addEventListener('DOMContentLoaded', () => { renderTimeline(); });
    </script>
</body>
</html>
