<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ... (保持您原有的 CSS 不變，以下新增/修改區塊) ... */
        
        /* 針對風格切換區的新位置樣式 */
        .utility-row-header { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        
        /* Emoji 面板編輯模式 */
        .emoji-edit-mode .emoji-item-btn { border: 2px dashed var(--primary); }
        .emoji-item-input { width: 100%; border: none; text-align: center; font-size: 1.2rem; background: transparent; }

    </style>
</head>
<body>

    <div class="calendar-container">
        <!-- 調整後的 Header 區塊 -->
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-month">📅 月</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
            
            <!-- 風格切換已移至此處 -->
            <div class="utility-row-header">
                <span class="sort-label">🎨 風格：</span>
                <div class="sort-select-wrapper" id="theme-btn-group">
                    <button class="sort-btn" data-theme="default">藍</button>
                    <button class="sort-btn" data-theme="macaron">甜</button>
                    <button class="sort-btn" data-theme="dark">夜</button>
                    <button class="sort-btn" data-theme="nordic">清</button>
                </div>
            </div>

            <!-- 跳轉日期 -->
            <div class="date-picker-row">
                <div class="date-picker-label-group">
                    <label for="date-select">跳轉日期：</label>
                    <input type="date" id="date-select">
                </div>
            </div>

            <div class="quick-jump-bar" id="quick-jump-bar">
                <span class="quick-jump-title">📍 跳轉：</span>
                <button class="quick-jump-btn jump-to-input-btn" id="btn-jump-to-input">✏️ 重要事項</button>
                <div class="quick-jump-list" id="quick-jump-list"></div>
            </div>

            <div style="margin-top: 6px;">
                <button class="quick-jump-btn" id="btn-toggle-emoji-modal" style="background: var(--bg-card); border-color: var(--primary); color: var(--primary); font-weight: 800; width: 100%; padding: 6px 12px; border-radius: var(--radius-md);">
                    😃 Emoji 選擇器
                </button>
            </div>
        </div>

        <!-- ... (其餘 HTML 結構維持不變) ... -->
    </div>

    <!-- Emoji 視窗調整 -->
    <div class="modal-overlay" id="emoji-modal" onclick="closeEmojiModal()">
        <div class="action-sheet" onclick="event.stopPropagation()" style="border-radius: 20px; max-height: 80vh; margin: auto 15px;">
            <div class="sheet-header">
                <span class="sheet-title-desc">😀 符號選擇器</span>
                <button class="cat-btn-edit" id="btn-toggle-emoji-edit" style="margin-top:5px;">編輯模式</button>
            </div>
            <div class="emoji-grid" id="emoji-grid-container"></div>
            <button class="sheet-close-btn" onclick="closeEmojiModal()">關閉選單</button>
        </div>
    </div>

    <script>
        // --- 新增 Emoji 編輯邏輯 ---
        let isEmojiEditMode = false;
        let emojiData = JSON.parse(localStorage.getItem('user_emojis')) || 
                        ['✅', '✔️', '☑️', '🔘', '⚪', '➕', '➖', '⭕', '❌', '🙆‍♀️', '🙅‍♀️', '🙆‍♂️', '🙅‍♂️', '☒', '☐', '■', '□', '✕', '✓', '✔', '✖', '✗', '✘', '×', '●', '○', 'ⓧ', '★', '☆', '✨', '🔥', '💡', '📌', '📎', '📅', '⏰', '🏠', '💼', '🚗', '✈️', '🍎', '☕', '🛒', '📚', '🎁', '🔔', '📢', '💬', '🎉', '🌈'];

        function renderEmojiGrid() {
            const container = document.getElementById('emoji-grid-container');
            container.innerHTML = '';
            
            // 確保有 50 個欄位
            for(let i=0; i<50; i++) {
                const val = emojiData[i] || '➕';
                const div = document.createElement('div');
                div.className = 'emoji-item-btn';
                if(isEmojiEditMode) {
                    div.innerHTML = `<input class="emoji-item-input" value="${val}" onchange="updateEmoji(${i}, this.value)">`;
                } else {
                    div.innerText = val;
                    div.onclick = () => insertEmojiToInput(val);
                }
                container.appendChild(div);
            }
        }

        function updateEmoji(index, val) {
            emojiData[index] = val;
            localStorage.setItem('user_emojis', JSON.stringify(emojiData));
        }

        document.getElementById('btn-toggle-emoji-edit').onclick = function() {
            isEmojiEditMode = !isEmojiEditMode;
            this.innerText = isEmojiEditMode ? '儲存清單' : '編輯模式';
            renderEmojiGrid();
        };

        // ... (保持其餘原有的 JS 邏輯) ...
    </script>
</body>
</html>
