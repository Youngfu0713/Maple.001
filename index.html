<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Collection Workbench</title>
    <style>
        :root {
            --primary-color: #8b5cf6;
            --secondary-color: #64748b;
            --radius-md: 12px;
            --bg-pastel: #fdf2f8;
        }

        body { font-family: sans-serif; padding: 20px; background-color: var(--bg-pastel); }

        /* 輸入表單區域 */
        .event-form {
            background: white; padding: 20px; border-radius: var(--radius-md);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
        
        #evt-title { 
            flex-grow: 1; padding: 12px; border: 1px solid #e2e8f0; 
            border-radius: var(--radius-md); outline: none;
        }

        .quick-time-btn {
            background: #f1f5f9; border: none; padding: 10px; 
            border-radius: var(--radius-md); cursor: pointer;
        }

        /* 按鈕容器 (您的新功能) */
        .btn-group-row { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }

        .submit-btn {
            background: var(--primary-color); color: white; border: none;
            padding: 12px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer;
        }

        .jump-btn { 
            font-family: inherit; background: var(--secondary-color); color: white; 
            border: none; padding: 12px; border-radius: var(--radius-md); 
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
        }

        /* 列表區域 */
        #timeline-list {
            padding: 20px; background: white; border-radius: var(--radius-md);
            min-height: 800px; /* 為了演示滾動效果設置高度 */
        }
    </style>
</head>
<body>

    <!-- 輸入區 -->
    <div class="event-form">
        <div class="form-row">
            <input type="text" id="evt-title" placeholder="請輸入重要事項..." required>
            <button class="quick-time-btn" id="btn-quick-time">⚡</button>
        </div>
        
        <div class="btn-group-row">
            <button class="submit-btn" id="add-evt-btn" style="flex: 3;">安排至行程表</button>
            <button class="jump-btn" id="btn-jump-to-timeline" style="flex: 1;">查看</button>
        </div>
    </div>

    <!-- 列表目標區 -->
    <div id="timeline-list">
        <h3>行程列表</h3>
        <p>行程內容將會顯示於此處...</p>
    </div>

    <script>
        // 核心邏輯
        function setupEventListeners() {
            // 跳轉邏輯
            document.getElementById('btn-jump-to-timeline').addEventListener('click', () => {
                const target = document.getElementById('timeline-list');
                if (target) {
                    target.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }
            });

            // 原有的提交邏輯 (請根據您的具體需求填入)
            document.getElementById('add-evt-btn').addEventListener('click', () => {
                const title = document.getElementById('evt-title').value;
                if(title) {
                    console.log("新增行程:", title);
                    // 在此執行您的 API 呼叫或 DOM 操作
                }
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', setupEventListeners);
    </script>
</body>
</html>
