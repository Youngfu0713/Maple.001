<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 完整功能版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'MiaoFont';
            src: url('Miao.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --primary: #5151e5;
            --primary-hover: #3d3dbd;
            --primary-light: #eef2ff;
            --bg-main: #fcfbfa; 
            --bg-card: #ffffff;
            --text-main: #1e293b; 
            --text-muted: #64748b;
            --border: #f1f5f9;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }

        body[data-theme="macaron"] { --primary: #f07b95; --primary-hover: #d85c78; --primary-light: #fff0f3; --bg-main: #faf6f0; --bg-card: #ffffff; --text-main: #4a3e3d; --text-muted: #8c7a78; --border: #f3e5df; --border-hover: #e6c2b8; }
        body[data-theme="dark"] { --primary: #818cf8; --primary-hover: #6366f1; --primary-light: #1e1b4b; --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --border-hover: #475569; }
        body[data-theme="nordic"] { --primary: #0d9488; --primary-hover: #0f766e; --primary-light: #ccfbf1; --bg-main: #f4f7f6; --bg-card: #ffffff; --text-main: #132a2f; --text-muted: #52796f; --border: #e0e7e5; --border-hover: #b2c9c2; }

        body { font-family: "MiaoFont", -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; overscroll-behavior-y: contain; }
        .calendar-container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
        .calendar-header { padding: 16px 20px 10px 20px; background: var(--bg-card); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .calendar-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
        .quick-nav { display: flex; gap: 6px; margin-bottom: 8px; }
        .nav-btn { padding: 8px 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; flex: 1; }
        #btn-today { flex: 1.1; background: var(--primary); color: white; border: none; }
        #btn-month { flex: 1.2; background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-hover); }

        .date-picker-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; margin-bottom: 8px; }
        .date-picker-row input[type="date"] { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-main); }
        .font-color-picker-container { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .font-color-picker-container input[type="color"] { border: none; width: 22px; height: 22px; cursor: pointer; background: none; }
        
        .quick-jump-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .quick-jump-list { display: flex; gap: 5px; overflow-x: auto; flex-grow: 1; }
        .quick-jump-btn { font-size: 0.73rem; padding: 3px 8px; border-radius: 14px; border: 1px solid var(--border-hover); background: var(--bg-card); cursor: pointer; }
        
        .event-form { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; gap: 8px; }
        .event-form input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 11px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        
        .timeline { padding: 10px 20px 20px 20px; flex-grow: 1; }
        .event-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; cursor: pointer; align-items: center; }
        .event-info { flex-grow: 1; }
        .manual-move-actions { display: flex; gap: 2px; }
        .move-step-btn { border: 1px solid var(--border-hover); background: var(--bg-card); cursor: pointer; width: 24px; height: 24px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.4); display: none; z-index: 200; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .action-sheet { width: 100%; max-width: 550px; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 24px; max-height: 80vh; overflow-y: auto; }
        .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sheet-btn { padding: 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 700; }
        .danger-btn { grid-column: span 2; color: #ef4444; }
        
        .sheet-edit-panel, .sheet-move-date-panel, .sheet-category-panel, .sheet-tag-action-panel { display: none; flex-direction: column; gap: 10px; }
        .sheet-edit-panel.show, .sheet-move-date-panel.show, .sheet-category-panel.show, .sheet-tag-action-panel.show { display: flex; }
        .sheet-panel-submit { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .sheet-close-btn { margin-top: 15px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; width: 100%; }
        
        .cat-tag-btn { padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; opacity: 0.45; border: 2px solid transparent; cursor: pointer; }
        .cat-tag-btn.active { opacity: 1; border-color: rgba(30, 41, 59, 0.7); }
        .sort-btn { padding: 5px 10px; border: 1px solid var(--border-hover); background: var(--bg-card); cursor: pointer; font-size: 0.72rem; }
        .sort-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
            <div class="quick-nav">
                <button class="nav-btn" id="btn-prev">◀ 前一天</button>
                <button class="nav-btn" id="btn-today">今天</button>
                <button class="nav-btn" id="btn-month">📅 月</button>
                <button class="nav-btn" id="btn-next">後一天 ▶</button>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;" id="theme-btn-group">
                <button class="sort-btn" data-theme="default">經典藍</button>
                <button class="sort-btn" data-theme="macaron">馬卡龍</button>
                <button class="sort-btn" data-theme="dark">深色夜間</button>
            </div>
            <div class="date-picker-row">
                <input type="date" id="date-select">
                <div class="font-color-picker-container">
                    <input type="color" id="evt-font-color" value="#000000">
                </div>
                <button class="quick-jump-btn" id="btn-toggle-emoji-modal">😃</button>
            </div>
            <div class="quick-jump-bar">
                <button class="quick-jump-btn" id="btn-jump-to-input">📍 跳轉新增</button>
                <div class="quick-jump-list" id="quick-jump-list"></div>
                <button class="quick-jump-btn" id="btn-jump-to-sort">⚡️</button>
            </div>
        </div>

        <div class="event-form">
            <div class="form-row">
                <input type="text" id="evt-title" placeholder="請輸入重要事項...">
                <button class="quick-time-btn" id="btn-quick-time">⚡ 時間</button>
            </div>
            <button class="submit-btn" id="add-evt-btn">安排至行程表</button>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;" id="category-buttons-list"></div>
            <div id="sub-category-container" style="margin-top: 10px;"></div>
            <button class="sort-btn" style="margin-top: 10px; width: 100%;" id="color-toggle-btn">⚙️ 管理類別</button>
        </div>

        <div id="sort-order-section" style="padding: 10px 20px;">
            <div style="display: flex; gap: 5px;">
                <button class="sort-btn" id="sort-btn-manual">手動排序</button>
                <button class="sort-btn" id="sort-btn-az">A-Z</button>
                <button class="sort-btn" id="sort-btn-za">Z-A</button>
            </div>
        </div>

        <div class="timeline" id="timeline-list"></div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="emoji-modal" onclick="closeEmojiModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div id="emoji-grid-container" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;"></div>
            <button class="sheet-close-btn" onclick="closeEmojiModal()">關閉</button>
        </div>
    </div>

    <div class="modal-overlay" id="month-modal" onclick="closeMonthModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <h3 id="month-picker-title"></h3>
            <div id="month-calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;"></div>
            <button class="sheet-close-btn" onclick="closeMonthModal()">關閉</button>
        </div>
    </div>

    <div class="modal-overlay" id="manage-modal" onclick="closeManageModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <h3>管理類別</h3>
            <div id="manage-categories-list"></div>
            <button class="sheet-close-btn" onclick="closeManageModal()">完成</button>
        </div>
    </div>

    <div class="modal-overlay" id="action-modal" onclick="closeActionModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <h3 id="modal-event-title">選擇操作</h3>
            <div class="sheet-grid" id="standard-action-grid">
                <button class="sheet-btn" id="modal-btn-edit">編輯內文</button>
                <button class="sheet-btn" id="modal-btn-move">跨日移動</button>
                <button class="sheet-btn" id="modal-btn-copy">複製事件</button>
                <button class="sheet-btn danger-btn" id="modal-btn-delete">刪除行程</button>
            </div>
            
            <div class="sheet-edit-panel" id="modal-edit-panel">
                <input type="text" id="modal-edit-title-input" style="padding: 10px;">
                <input type="color" id="modal-edit-color-input">
                <button class="sheet-panel-submit" id="modal-edit-submit">確認修改</button>
            </div>

            <div class="sheet-move-date-panel" id="modal-move-panel">
                <input type="date" id="modal-move-date-input" style="padding: 10px;">
                <button class="sheet-panel-submit" id="modal-move-submit">確認移轉</button>
            </div>
            
            <button class="sheet-close-btn" onclick="closeActionModal()">取消</button>
        </div>
    </div>

    <script>
        // --- 初始化狀態 ---
        let currentDate = new Date().toISOString().split('T')[0];
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let sortMode = localStorage.getItem('calendar_sort_mode') || 'manual';
        let categories = JSON.parse(localStorage.getItem('calendar_categories')) || [
            { id: "cat_work", name: "工作", color: "#5151e5", subGroups: [{ title: "任務", items: ["會議", "開發"] }] },
            { id: "cat_life", name: "生活", color: "#10b981", subGroups: [{ title: "雜項", items: ["購物"] }] }
        ];
        let activeTargetEventId = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderTimeline();
            renderCategorySelectors();
            setupEventListeners();
        });

        // --- 核心功能函數 ---
        function setupEventListeners() {
            document.getElementById('add-evt-btn').addEventListener('click', submitEventForm);
            document.getElementById('btn-prev').addEventListener('click', () => changeDate(-1));
            document.getElementById('btn-next').addEventListener('click', () => changeDate(1));
            
            // 模組按鈕綁定
            document.getElementById('modal-btn-edit').addEventListener('click', () => {
                const evt = events.find(e => e.id === activeTargetEventId);
                if(!evt) return;
                document.getElementById('modal-edit-title-input').value = evt.title;
                document.getElementById('modal-edit-color-input').value = evt.fontColor || '#000000';
                closeAllSheetPanels(); document.getElementById('modal-edit-panel').classList.add('show');
            });

            document.getElementById('modal-btn-delete').addEventListener('click', () => {
                if(confirm('確定刪除此行程？')) {
                    events = events.filter(e => e.id !== activeTargetEventId);
                    saveToStorage(); renderTimeline(); closeActionModal();
                }
            });

            document.getElementById('modal-btn-move').addEventListener('click', () => {
                const evt = events.find(e => e.id === activeTargetEventId);
                document.getElementById('modal-move-date-input').value = evt.date;
                closeAllSheetPanels(); document.getElementById('modal-move-panel').classList.add('show');
            });

            document.getElementById('modal-btn-copy').addEventListener('click', () => {
                const evt = events.find(e => e.id === activeTargetEventId);
                const newEvt = { ...evt, id: 'evt-' + Date.now(), orderIndex: events.filter(e => e.date === evt.date).length };
                events.push(newEvt); saveToStorage(); renderTimeline(); closeActionModal();
            });

            document.getElementById('modal-edit-submit').addEventListener('click', () => {
                const idx = events.findIndex(e => e.id === activeTargetEventId);
                if (idx !== -1) {
                    events[idx].title = document.getElementById('modal-edit-title-input').value;
                    events[idx].fontColor = document.getElementById('modal-edit-color-input').value;
                    saveToStorage(); renderTimeline(); closeActionModal();
                }
            });

            document.getElementById('modal-move-submit').addEventListener('click', () => {
                const idx = events.findIndex(e => e.id === activeTargetEventId);
                if (idx !== -1) {
                    events[idx].date = document.getElementById('modal-move-date-input').value;
                    saveToStorage(); renderTimeline(); closeActionModal();
                }
            });
        }

        function saveToStorage() {
            localStorage.setItem('calendar_events', JSON.stringify(events));
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-list');
            container.innerHTML = '';
            let dayEvents = events.filter(e => e.date === currentDate);
            
            dayEvents.forEach((evt) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `<div class="event-info"><p style="color:${evt.fontColor}">${evt.title}</p></div>`;
                card.onclick = () => openActionModal(evt.id);
                container.appendChild(card);
            });
            document.getElementById('current-day').innerText = currentDate;
        }

        function openActionModal(targetId) {
            activeTargetEventId = targetId;
            const evt = events.find(e => e.id === targetId);
            document.getElementById('modal-event-title').innerText = evt ? evt.title : '操作';
            document.getElementById('action-modal').classList.add('show');
            document.getElementById('standard-action-grid').style.display = 'grid';
            closeAllSheetPanels();
        }

        function closeAllSheetPanels() {
            document.getElementById('modal-edit-panel').classList.remove('show');
            document.getElementById('modal-move-panel').classList.remove('show');
        }

        function closeActionModal() { document.getElementById('action-modal').classList.remove('show'); }
        function closeEmojiModal() { document.getElementById('emoji-modal').classList.remove('show'); }
        function closeMonthModal() { document.getElementById('month-modal').classList.remove('show'); }
        function closeManageModal() { document.getElementById('manage-modal').classList.remove('show'); }

        function changeDate(offset) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + offset);
            currentDate = d.toISOString().split('T')[0];
            renderTimeline();
        }

        function submitEventForm() {
            const titleInput = document.getElementById('evt-title');
            if(!titleInput.value) return;
            events.push({ id: 'evt-' + Date.now(), date: currentDate, title: titleInput.value, fontColor: document.getElementById('evt-font-color').value });
            saveToStorage(); titleInput.value = ''; renderTimeline();
        }

        function renderCategorySelectors() { /* 簡化呈現 */ }
    </script>
</body>
</html>
