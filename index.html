<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 優化版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @font-face {
            font-family: 'MiaoFont';
            src: url('Miao.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --primary: #5151e5; --primary-hover: #3d3dbd; --primary-light: #eef2ff;
            --bg-main: #fcfbfa; --bg-card: #ffffff; --text-main: #1e293b; 
            --text-muted: #64748b; --border: #f1f5f9; --border-hover: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
        }

        /* 風格主題 */
        body[data-theme="macaron"] { --primary: #f07b95; --primary-light: #fff0f3; --bg-main: #faf6f0; --text-main: #4a3e3d; --text-muted: #8c7a78; --border: #f3e5df; --border-hover: #e6c2b8; }
        body[data-theme="dark"] { --primary: #818cf8; --primary-light: #1e1b4b; --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --border-hover: #475569; }
        body[data-theme="nordic"] { --primary: #0d9488; --primary-light: #ccfbf1; --bg-main: #f4f7f6; --text-main: #132a2f; --text-muted: #52796f; --border: #e0e7e5; --border-hover: #b2c9c2; }

        body { font-family: "MiaoFont", sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; transition: background-color 0.25s, color 0.25s; }
        .calendar-container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; box-shadow: var(--shadow-md); display: flex; flex-direction: column; margin: 0 auto; }
        
        .calendar-header { padding: 16px 20px 10px 20px; border-bottom: 1px solid var(--border); }
        .calendar-header h1 { margin: 0 0 8px 0; font-size: 1.15rem; font-weight: 800; text-align: center; }
        .quick-nav { display: flex; gap: 6px; margin-bottom: 8px; }
        .nav-btn { flex: 1; padding: 8px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }
        
        .event-form { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; gap: 8px; }
        .event-form input[type="text"] { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-main); }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 11px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }

        /* 行程卡片與動作列 */
        .timeline { padding: 10px 20px; flex-grow: 1; background: var(--bg-main); }
        .event-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); box-shadow: var(--shadow-sm); }
        .event-info { flex-grow: 1; min-width: 0; }
        .event-text-line { font-size: 0.92rem; font-weight: 700; margin: 0; }
        .prefix-badge-main { font-weight: 900; margin-right: 4px; }
        .prefix-badge-time { font-weight: 900; color: var(--text-muted); margin-right: 4px; }
        
        /* 新增：卡片右側動作連結 */
        .event-actions { display: flex; flex-direction: column; gap: 4px; margin-left: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: right; color: var(--text-muted); }
        .action-link { padding: 2px 4px; }
        .action-edit { color: var(--text-main); }
        .action-del { color: #ef4444; }
        .action-link:hover { opacity: 0.7; }

        .manual-move-actions { display: flex; gap: 2px; margin-left: 10px; }
        .move-step-btn { border: 1px solid var(--border-hover); background: var(--bg-card); color: var(--text-muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }

        /* 其他輔助樣式省略... (保留原有 modal 樣式) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .action-sheet { width: 100%; max-width: 550px; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 24px; box-shadow: 0 -15px 40px rgba(15, 23, 42, 0.12); transform: translateY(100%); transition: transform 0.32s; }
        .modal-overlay.show .action-sheet { transform: translateY(0); }
        .sheet-close-btn { width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">
        <h1 id="current-day">日程管理</h1>
        <div class="quick-nav">
            <button class="nav-btn" id="btn-prev">◀ 前一天</button>
            <button class="nav-btn" id="btn-today">今天</button>
            <button class="nav-btn" id="btn-month">📅 月</button>
            <button class="nav-btn" id="btn-next">後一天 ▶</button>
        </div>
    </div>

    <div class="event-form">
        <div class="form-row">
            <input type="text" id="evt-title" placeholder="請輸入重要事項...">
        </div>
        <button class="submit-btn" id="add-evt-btn">安排至行程表</button>
    </div>

    <div class="timeline" id="timeline-list"></div>
</div>

<script>
    let currentDate = new Date().toISOString().split('T')[0];
    let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
    let sortMode = 'manual';

    window.addEventListener('DOMContentLoaded', () => {
        renderTimeline();
        document.getElementById('add-evt-btn').addEventListener('click', submitEvent);
        document.getElementById('btn-prev').addEventListener('click', () => changeDate(-1));
        document.getElementById('btn-next').addEventListener('click', () => changeDate(1));
    });

    function changeDate(offset) {
        let d = new Date(currentDate);
        d.setDate(d.getDate() + offset);
        currentDate = d.toISOString().split('T')[0];
        renderTimeline();
    }

    function submitEvent() {
        const title = document.getElementById('evt-title').value.trim();
        if (!title) return;
        events.push({ id: 'evt-' + Date.now(), date: currentDate, title: title, orderIndex: events.filter(e => e.date === currentDate).length });
        localStorage.setItem('calendar_events', JSON.stringify(events));
        document.getElementById('evt-title').value = '';
        renderTimeline();
    }

    function deleteEvent(id) {
        if (confirm('確定要刪除此行程嗎？')) {
            events = events.filter(e => e.id !== id);
            localStorage.setItem('calendar_events', JSON.stringify(events));
            renderTimeline();
        }
    }

    function editEvent(id) {
        const evt = events.find(e => e.id === id);
        if (!evt) return;
        const newTitle = prompt('請修改事項內容：', evt.title);
        if (newTitle !== null) {
            evt.title = newTitle;
            localStorage.setItem('calendar_events', JSON.stringify(events));
            renderTimeline();
        }
    }

    function moveOrderStep(evtId, direction) {
        let dayEvents = events.filter(e => e.date === currentDate).sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        const idx = dayEvents.findIndex(e => e.id === evtId);
        const sw = idx + direction;
        if (sw < 0 || sw >= dayEvents.length) return;
        const temp = dayEvents[idx].orderIndex;
        dayEvents[idx].orderIndex = dayEvents[sw].orderIndex;
        dayEvents[sw].orderIndex = temp;
        localStorage.setItem('calendar_events', JSON.stringify(events));
        renderTimeline();
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-list');
        container.innerHTML = '';
        document.getElementById('current-day').innerText = currentDate;
        
        let dayEvents = events.filter(e => e.date === currentDate).sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        
        dayEvents.forEach((evt, index) => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="event-info">
                    <p class="event-text-line">${evt.title}</p>
                </div>
                <div class="event-actions">
                    <span class="action-link action-edit" onclick="editEvent('${evt.id}')">編輯</span>
                    <span class="action-link action-del" onclick="deleteEvent('${evt.id}')">刪除</span>
                </div>
                <div class="manual-move-actions">
                    <button class="move-step-btn" onclick="moveOrderStep('${evt.id}', -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
                    <button class="move-step-btn" onclick="moveOrderStep('${evt.id}', 1)" ${index === dayEvents.length - 1 ? 'disabled' : ''}>▼</button>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
