<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人日程管理系統 - 完整功能版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* CSS 與你原本的設計保持一致 */
        :root { --primary: #5151e5; --primary-hover: #3d3dbd; --primary-light: #eef2ff; --bg-main: #fcfbfa; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #f1f5f9; --border-hover: #cbd5e1; --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04); --shadow-md: 0 10px 30px -10px rgba(15, 23, 42, 0.08); --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; }
        .calendar-container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
        .calendar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .timeline { padding: 20px; flex-grow: 1; }
        .event-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; cursor: pointer; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .action-sheet { width: 100%; max-width: 550px; background: white; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; }
        .sheet-btn { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid var(--border); border-radius: 8px; background: white; cursor: pointer; font-weight: bold; }
        .danger-btn { color: #ef4444; border-color: #fca5a5; }
        .sheet-edit-panel, .sheet-move-date-panel, .sheet-category-panel, .sheet-tag-action-panel { display: none; padding: 15px 0; }
        .sheet-edit-panel.show, .sheet-move-date-panel.show, .sheet-category-panel.show, .sheet-tag-action-panel.show { display: block; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1 id="current-day">日程管理</h1>
        </div>

        <div class="event-form" style="padding: 16px;">
            <input type="text" id="evt-title" placeholder="輸入事項..." style="width: 90%; padding: 10px; margin-bottom: 10px;">
            <button id="add-evt-btn" style="width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px;">新增行程</button>
        </div>

        <div class="timeline" id="timeline-list">
            <!-- 行程將會顯示在這裡 -->
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="action-modal">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div id="standard-action-grid">
                <button class="sheet-btn" id="modal-btn-edit">編輯內文</button>
                <button class="sheet-btn danger-btn" id="modal-btn-delete">刪除本行程</button>
                <button class="sheet-btn" onclick="closeActionModal()">取消</button>
            </div>
            
            <div class="sheet-edit-panel" id="modal-edit-panel">
                <input type="text" id="modal-edit-title-input" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <button class="sheet-btn" id="modal-edit-submit">確認修改</button>
            </div>
        </div>
    </div>

    <script>
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let activeTargetEventId = null;

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderTimeline();
            setupEventListeners();
        });

        function setupEventListeners() {
            // 新增按鈕
            document.getElementById('add-evt-btn').onclick = () => {
                const title = document.getElementById('evt-title').value;
                if(!title) return;
                events.push({ id: 'evt-' + Date.now(), date: new Date().toISOString().split('T')[0], title: title });
                saveAndRender();
                document.getElementById('evt-title').value = '';
            };

            // Modal 按鈕綁定
            document.getElementById('modal-btn-delete').onclick = () => {
                if(confirm('確定刪除？')) {
                    events = events.filter(e => e.id !== activeTargetEventId);
                    saveAndRender();
                    closeActionModal();
                }
            };

            document.getElementById('modal-btn-edit').onclick = () => {
                const evt = events.find(e => e.id === activeTargetEventId);
                document.getElementById('modal-edit-title-input').value = evt.title;
                document.getElementById('standard-action-grid').style.display = 'none';
                document.getElementById('modal-edit-panel').classList.add('show');
            };

            document.getElementById('modal-edit-submit').onclick = () => {
                const evt = events.find(e => e.id === activeTargetEventId);
                evt.title = document.getElementById('modal-edit-title-input').value;
                saveAndRender();
                closeActionModal();
            };
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-list');
            container.innerHTML = '';
            events.forEach(evt => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `<span>${evt.title}</span>`;
                // 改為單擊觸發
                card.onclick = () => openActionModal(evt.id);
                container.appendChild(card);
            });
        }

        function openActionModal(id) {
            activeTargetEventId = id;
            document.getElementById('standard-action-grid').style.display = 'block';
            document.getElementById('modal-edit-panel').classList.remove('show');
            document.getElementById('action-modal').classList.add('show');
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('show');
        }

        function saveAndRender() {
            localStorage.setItem('calendar_events', JSON.stringify(events));
            renderTimeline();
        }

        // 點擊 Modal 外區域關閉
        document.getElementById('action-modal').onclick = () => closeActionModal();
    </script>
</body>
</html>
