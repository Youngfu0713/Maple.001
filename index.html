<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人行程排程與類別管理系統</title>
    <style>
        :root {
            --primary: #7b61ff;
            --primary-light: #f0ecff;
            --bg-main: #fcf9f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #8a99ad;
            --border-color: #f0edeb;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            height: calc(100vh - 32px);
        }

        /* --- 頂部導覽區 --- */
        .app-header {
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon-text {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-icon-text:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-add {
            background: var(--primary);
            color: #ffffff;
        }

        .date-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f7fb;
            padding: 6px 12px;
            border-radius: 12px;
        }

        .date-nav button {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
        }

        .date-display {
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* --- 行程時間軸區 --- */
        .timeline-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-time {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .event-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .event-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .main-tag {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .sub-tag {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: #f1f3f5;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* --- 彈出視窗（Modal）通用樣式 --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            width: 100%;
            max-height: 85%;
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .modal-overlay.show .modal-sheet {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sheet-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .sheet-close {
            background: #f1f3f5;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* --- 分類選擇列表樣式 --- */
        .sheet-category-item-wrapper {
            background: #fcfbfe;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .sheet-cat-main-row {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .sheet-sub-group-block {
            padding: 8px 14px 12px 14px;
            background: #ffffff;
            border-top: 1px dashed var(--border-color);
        }

        .sheet-sub-group-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }

        .sheet-sub-grid-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .sheet-sub-pill-btn {
            border: 1px solid var(--border-color);
            background: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sheet-sub-pill-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .modal-actions-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-flex-1 {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .btn-save {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-delete {
            background: #ffe3e3;
            color: #e03131;
        }

        /* --- 類別總覽（Overview Modal）樣式 --- */
        .overview-filter-group {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .overview-filter-group::-webkit-scrollbar {
            display: none;
        }

        .overview-sub-filter-btn {
            white-space: nowrap;
            background: #f1f3f5;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .overview-sub-filter-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .cat-group-section {
            margin-bottom: 16px;
        }

        .cat-group-date-label {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .cat-group-mini-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .cat-group-mini-title {
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頁首與導覽區 -->
        <header class="app-header">
            <div class="header-top">
                <h1 class="header-title">📅 排程筆記</h1>
                <div class="header-actions">
                    <button class="btn-icon-text" id="btn-cat-overview">🔍 總覽</button>
                    <button class="btn-icon-text btn-add" id="btn-add-event">＋ 新增</button>
                </div>
            </div>
            <div class="date-nav">
                <button id="btn-prev-date">❮</button>
                <span class="date-display" id="date-display-text">2026-07-26 (日)</span>
                <button id="btn-next-date">❯</button>
            </div>
        </header>

        <!-- 行程時間軸內容區 -->
        <main class="timeline-container" id="timeline-container">
            <!-- 動態渲染行程卡片 -->
        </main>

        <!-- 彈出視窗 1：單一行程編輯與分類設定 Modal -->
        <div class="modal-overlay" id="action-modal">
            <div class="modal-sheet">
                <div class="sheet-header">
                    <h3 class="sheet-title" id="action-modal-title">行程分類與設定</h3>
                    <button class="sheet-close" id="modal-close-btn">✕</button>
                </div>
                
                <div id="modal-category-selection-list">
                    <!-- 動態渲染類別與子標籤選擇按鈕 -->
                </div>

                <div class="modal-actions-row">
                    <button class="btn-flex-1 btn-delete" id="modal-btn-delete">刪除行程</button>
                    <button class="btn-flex-1 btn-save" id="modal-category-submit">儲存修改</button>
                </div>
            </div>
        </div>

        <!-- 彈出視窗 2：分類總覽（Overview Modal） -->
        <div class="modal-overlay" id="overview-modal">
            <div class="modal-sheet" style="max-height: 90%;">
                <div class="sheet-header">
                    <h3 class="sheet-title">🗂️ 分類行程總覽</h3>
                    <button class="sheet-close" id="overview-close-btn">✕</button>
                </div>

                <!-- 主類別 Tab 篩選頁籤 -->
                <div class="overview-filter-group" id="overview-main-cat-tabs"></div>

                <!-- 子標籤 Tab 篩選頁籤 -->
                <div class="overview-filter-group" id="overview-sub-cat-tabs"></div>

                <!-- 搜尋與篩選結果呈現區 -->
                <div id="overview-result-timeline" style="flex: 1; overflow-y: auto; margin-top: 8px;">
                    <!-- 動態渲染符合條件的行程 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- 初始化資料與分類定義 --- */
        const categories = [
            {
                name: '工作職場',
                color: '#FFB3BA',
                subGroups: [
                    { title: '項目類型', items: ['會議', '專案', '報告', '出差'] },
                    { title: '優先程度', items: ['緊急', '重要', '待追蹤'] }
                ]
            },
            {
                name: '個人生活',
                color: '#BAE1FF',
                subGroups: [
                    { title: '生活類別', items: ['家務', '採買', '帳單', '休養'] }
                ]
            },
            {
                name: '學習提升',
                color: '#BAFFC9',
                subGroups: [
                    { title: '學習主題', items: ['程式開發', '外語', '閱讀', '線上課程'] }
                ]
            },
            {
                name: '健康運動',
                color: '#FFFFBA',
                subGroups: [
                    { title: '運動項目', items: ['健身', '跑步', '瑜伽', '回診'] }
                ]
            }
        ];

        // 日期與系統狀態
        let currentDate = '2026-07-26';
        let activeTargetEventId = null;

        // 預設示範行程
        let events = [
            {
                id: 'evt-1',
                date: '2026-07-26',
                time: '09:00 - 10:30',
                title: 'NMMO 溶劑回收系統會議',
                mainCategoryName: '工作職場',
                mainCategoryColor: '#FFB3BA',
                subCategories: ['會議', '重要'],
                fontColor: '#2c3e50'
            },
            {
                id: 'evt-2',
                date: '2026-07-26',
                time: '14:00 - 16:00',
                title: 'Python / GAS 腳本開發',
                mainCategoryName: '學習提升',
                mainCategoryColor: '#BAFFC9',
                subCategories: ['程式開發'],
                fontColor: '#2c3e50'
            },
            {
                id: 'evt-3',
                date: '2026-07-27',
                time: '19:00 - 20:30',
                title: '健身房有氧與重訓',
                mainCategoryName: '健康運動',
                mainCategoryColor: '#FFFFBA',
                subCategories: ['健身'],
                fontColor: '#2c3e50'
            }
        ];

        /* --- LocalStorage 持久化儲存 --- */
        function loadFromStorage() {
            const saved = localStorage.getItem('app_timeline_events');
            if (saved) {
                try { events = JSON.parse(saved); } catch (e) { console.error(e); }
            }
        }

        function saveToStorage() {
            localStorage.setItem('app_timeline_events', JSON.stringify(events));
        }

        /* --- 頁面初始化與導覽 --- */
        document.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            initDateConfig();
            renderTimeline();
            setupEventListeners();
        });

        function initDateConfig() {
            const d = new Date(currentDate);
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('date-display-text').innerText = `${currentDate} (${days[d.getDay()]})`;
        }

        function setupEventListeners() {
            document.getElementById('btn-prev-date').addEventListener('click', () => changeDate(-1));
            document.getElementById('btn-next-date').addEventListener('click', () => changeDate(1));
            document.getElementById('btn-add-event').addEventListener('click', addNewEventPrompt);
            document.getElementById('modal-close-btn').addEventListener('click', closeActionModal);
            document.getElementById('overview-close-btn').addEventListener('click', closeOverviewModal);
        }

        function changeDate(offsetDays) {
            const d = new Date(currentDate);
            d.setDate(d.getDate() + offsetDays);
            currentDate = d.toISOString().split('T')[0];
            initDateConfig();
            renderTimeline();
        }

        function addNewEventPrompt() {
            const title = prompt('請輸入新增行程標題：');
            if (!title) return;
            const newEvt = {
                id: 'evt-' + Date.now(),
                date: currentDate,
                time: '10:00 - 11:00',
                title: title,
                mainCategoryName: '',
                mainCategoryColor: '#7b61ff',
                subCategories: [],
                fontColor: '#2c3e50'
            };
            events.push(newEvt);
            saveToStorage();
            renderTimeline();
            openActionModal(newEvt.id);
        }

        /* --- 時間軸卡片渲染 --- */
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            const dayEvents = events.filter(e => e.date === currentDate);

            if (dayEvents.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px 0; color: var(--text-muted); font-size:0.9rem;">今天尚無排定行程，點擊「＋ 新增」開始規劃吧！</div>`;
                return;
            }

            dayEvents.forEach(evt => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.style.borderLeftColor = evt.mainCategoryColor || 'var(--primary)';

                const tagsHtml = [
                    evt.mainCategoryName ? `<span class="main-tag" style="background:${evt.mainCategoryColor}33; color:${evt.mainCategoryColor}">${evt.mainCategoryName}</span>` : '',
                    ...(evt.subCategories || []).map(s => `<span class="sub-tag">#${s}</span>`)
                ].join('');

                card.innerHTML = `
                    <div class="event-header">
                        <span class="event-time">⏰ ${evt.time}</span>
                    </div>
                    <div class="event-title">${evt.title}</div>
                    ${tagsHtml ? `<div class="event-tags">${tagsHtml}</div>` : ''}
                `;

                card.onclick = () => openActionModal(evt.id);
                container.appendChild(card);
            });
        }

        function jumpToEventCard(eventId) {
            openActionModal(eventId);
        }

        /* --- 行程編輯與分類 Modal 邏輯 --- */
        function openActionModal(eventId) {
            activeTargetEventId = eventId;
            const evt = events.find(e => e.id === eventId);
            if (!evt) return;

            document.getElementById('action-modal-title').innerText = evt.title;
            modalTempMainCat = null;
            modalTempSubCats = [];
            renderModalCategoryGrid();
            document.getElementById('action-modal').classList.add('show');
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('show');
        }

        /* --- 核心邏輯：分類選擇 Grid 與單複選控制 --- */
        let modalTempMainCat = null;
        let modalTempSubCats = [];

        function renderModalCategoryGrid() {
            const evt = events.find(e => e.id === activeTargetEventId);
            if (!evt) return;

            if (modalTempMainCat === null) {
                modalTempMainCat = evt.mainCategoryName || '';
                modalTempSubCats = [...(evt.subCategories || [])];
            }

            const container = document.getElementById('modal-category-selection-list');
            container.innerHTML = '';

            categories.forEach(cat => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'sheet-category-item-wrapper';

                const isMainActive = (modalTempMainCat === cat.name);

                const mainRow = document.createElement('div');
                mainRow.className = 'sheet-cat-main-row';
                if (isMainActive) {
                    mainRow.style.backgroundColor = 'var(--primary-light)';
                }

                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.style.backgroundColor = cat.color;

                const nameText = document.createElement('span');
                nameText.style.flex = '1';
                nameText.innerText = cat.name + (isMainActive ? '  ✓' : '');

                mainRow.appendChild(dot);
                mainRow.appendChild(nameText);

                mainRow.onclick = () => {
                    modalTempMainCat = cat.name;
                    modalTempSubCats = [];
                    renderModalCategoryGrid();
                };

                itemWrapper.appendChild(mainRow);

                if (isMainActive && cat.subGroups && cat.subGroups.length > 0) {
                    cat.subGroups.forEach(group => {
                        const subBlock = document.createElement('div');
                        subBlock.className = 'sheet-sub-group-block';

                        const groupTitle = document.createElement('span');
                        groupTitle.className = 'sheet-sub-group-title';
                        groupTitle.innerText = group.title;
                        subBlock.appendChild(groupTitle);

                        const pillsRow = document.createElement('div');
                        pillsRow.className = 'sheet-sub-grid-row';

                        group.items.forEach(subItem => {
                            const btn = document.createElement('button');
                            const isSubActive = modalTempSubCats.includes(subItem);
                            btn.className = `sheet-sub-pill-btn ${isSubActive ? 'active' : ''}`;
                            btn.innerText = subItem;
                            
                            btn.onclick = (e) => {
                                e.stopPropagation();
                                if (isSubActive) {
                                    modalTempSubCats = modalTempSubCats.filter(s => s !== subItem);
                                } else {
                                    modalTempSubCats.push(subItem);
                                }
                                renderModalCategoryGrid();
                            };

                            pillsRow.appendChild(btn);
                        });

                        subBlock.appendChild(pillsRow);
                        itemWrapper.appendChild(subBlock);
                    });
                }

                container.appendChild(itemWrapper);
            });
        }

        /* --- 彈出視窗：分類設定儲存與行程刪除 --- */
        document.getElementById('modal-category-submit').addEventListener('click', () => {
            const evt = events.find(e => e.id === activeTargetEventId);
            if (evt) {
                const matchedCat = categories.find(c => c.name === modalTempMainCat);
                evt.mainCategoryName = modalTempMainCat || '';
                evt.mainCategoryColor = matchedCat ? matchedCat.color : '#5151e5';
                evt.subCategories = [...modalTempSubCats];
                saveToStorage();
                renderTimeline();
                closeActionModal();
            }
        });

        document.getElementById('modal-btn-delete').addEventListener('click', () => {
            const evt = events.find(e => e.id === activeTargetEventId);
            if (evt && confirm(`確定要刪除行程：「${evt.title}」嗎？`)) {
                events = events.filter(e => e.id !== activeTargetEventId);
                saveToStorage();
                renderTimeline();
                closeActionModal();
            }
        });

        /* --- 類別總覽 (Overview Modal) 邏輯 --- */
        let overviewSelectedCat = 'all';
        let overviewSelectedSubCat = 'all';

        document.getElementById('btn-cat-overview').addEventListener('click', openOverviewModal);

        function openOverviewModal() {
            overviewSelectedCat = 'all';
            overviewSelectedSubCat = 'all';
            renderOverviewTabs();
            renderOverviewResult();
            document.getElementById('overview-modal').classList.add('show');
        }

        function closeOverviewModal() {
            document.getElementById('overview-modal').classList.remove('show');
        }

        function renderOverviewTabs() {
            const mainTabsContainer = document.getElementById('overview-main-cat-tabs');
            const subTabsContainer = document.getElementById('overview-sub-cat-tabs');
            
            mainTabsContainer.innerHTML = '';
            subTabsContainer.innerHTML = '';

            // 1. 渲染主類別篩選按鈕
            const allMainBtn = document.createElement('button');
            allMainBtn.className = `overview-sub-filter-btn ${overviewSelectedCat === 'all' ? 'active' : ''}`;
            allMainBtn.innerText = '全部主類別';
            allMainBtn.onclick = () => {
                overviewSelectedCat = 'all';
                overviewSelectedSubCat = 'all';
                renderOverviewTabs();
                renderOverviewResult();
            };
            mainTabsContainer.appendChild(allMainBtn);

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `overview-sub-filter-btn ${overviewSelectedCat === cat.name ? 'active' : ''}`;
                btn.innerText = cat.name;
                btn.onclick = () => {
                    overviewSelectedCat = cat.name;
                    overviewSelectedSubCat = 'all';
                    renderOverviewTabs();
                    renderOverviewResult();
                };
                mainTabsContainer.appendChild(btn);
            });

            // 2. 渲染子類別篩選按鈕 (若有選定特定主類別)
            if (overviewSelectedCat !== 'all') {
                const targetCat = categories.find(c => c.name === overviewSelectedCat);
                if (targetCat && targetCat.subGroups) {
                    const allSubBtn = document.createElement('button');
                    allSubBtn.className = `overview-sub-filter-btn ${overviewSelectedSubCat === 'all' ? 'active' : ''}`;
                    allSubBtn.innerText = '全部子標籤';
                    allSubBtn.onclick = () => {
                        overviewSelectedSubCat = 'all';
                        renderOverviewTabs();
                        renderOverviewResult();
                    };
                    subTabsContainer.appendChild(allSubBtn);

                    const collectedItems = new Set();
                    targetCat.subGroups.forEach(g => g.items.forEach(i => collectedItems.add(i)));

                    collectedItems.forEach(item => {
                        const btn = document.createElement('button');
                        btn.className = `overview-sub-filter-btn ${overviewSelectedSubCat === item ? 'active' : ''}`;
                        btn.innerText = item;
                        btn.onclick = () => {
                            overviewSelectedSubCat = item;
                            renderOverviewTabs();
                            renderOverviewResult();
                        };
                        subTabsContainer.appendChild(btn);
                    });
                }
            }
        }

        function renderOverviewResult() {
            const container = document.getElementById('overview-result-timeline');
            container.innerHTML = '';

            let filteredEvents = events.filter(e => {
                let matchCat = (overviewSelectedCat === 'all' || e.mainCategoryName === overviewSelectedCat);
                let matchSub = (overviewSelectedSubCat === 'all' || (e.subCategories && e.subCategories.includes(overviewSelectedSubCat)));
                return matchCat && matchSub;
            });

            if (filteredEvents.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:0.85rem;">此條件下查無任何行程。</div>';
                return;
            }

            // 按日期分類呈現
            const groupedByDate = {};
            filteredEvents.forEach(evt => {
                if (!groupedByDate[evt.date]) groupedByDate[evt.date] = [];
                groupedByDate[evt.date].push(evt);
            });

            const sortedDates = Object.keys(groupedByDate).sort();

            sortedDates.forEach(dateStr => {
                const groupSection = document.createElement('div');
                groupSection.className = 'cat-group-section';

                const dateLabel = document.createElement('span');
                dateLabel.className = 'cat-group-date-label';
                dateLabel.innerText = `📅 ${dateStr}`;
                groupSection.appendChild(dateLabel);

                groupedByDate[dateStr].forEach(evt => {
                    const card = document.createElement('div');
                    card.className = 'cat-group-mini-card';
                    
                    const titleRow = document.createElement('div');
                    titleRow.className = 'cat-group-mini-title-row';

                    const mainBadge = evt.mainCategoryName ? `<span style="color:${evt.mainCategoryColor || 'var(--primary)'}; font-weight:900;">[${evt.mainCategoryName}]</span> ` : '';
                    const subText = (evt.subCategories && evt.subCategories.length > 0) ? `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">🏷️ ${evt.subCategories.join('/')}</div>` : '';

                    titleRow.innerHTML = `<p class="cat-group-mini-title" style="color:${evt.fontColor || 'var(--text-main)'};">${mainBadge}${evt.title}</p>`;
                    card.appendChild(titleRow);
                    if (subText) card.innerHTML += subText;

                    card.onclick = () => {
                        currentDate = evt.date;
                        initDateConfig();
                        renderTimeline();
                        closeOverviewModal();
                        setTimeout(() => jumpToEventCard(evt.id), 200);
                    };

                    groupSection.appendChild(card);
                });

                container.appendChild(groupSection);
            });
        }
    </script>
</body>
</html>
